name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies (prefer lockfile, fall back if missing)
        run: npm ci || npm install

      - name: Diagnostic: show package.json and available npm scripts
        run: |
          echo "-- package.json --"
          cat package.json
          echo
          echo "-- npm run (scripts) --"
          npm run
          echo

      - name: Lint (check)
        run: npm run lint:check --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present
 
