<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assign Task | SyncBoard</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="app-shell"><aside class="sidebar"><div class="brand"><div class="logo-mark">S</div>SyncBoard</div><nav class="nav"><a href="dashboard.html"><span>▦</span>Dashboard</a><a href="tasks.html"><span>☑</span>Manage Tasks</a><a href="add-task.html" class="active"><span>＋</span>Assign Task</a><a href="members.html"><span>👥</span>Members</a><a href="requests.html"><span>✦</span>Requests</a><a href="reports.html"><span>▤</span>Reports</a><a href="settings.html"><span>⚙</span>Settings</a></nav><div class="sidebar-bottom"><button class="btn secondary" data-admin-logout style="width:100%">↪ Logout</button></div></aside><div class="app-area"><header class="topbar"><div class="top-left"><button class="icon-btn mobile-menu" data-menu>☰</button><strong>Assign Task</strong></div><div class="userbox"><button class="icon-btn" data-theme>◐</button><div class="avatar">AD</div><div class="usertext"><strong>Admin</strong><div class="small muted">Administrator</div></div></div></header><main class="main"><div class="page-head"><div><h1>Assign Task</h1><p>Create work, choose the responsible member and send an automatic notification.</p></div></div><section class="panel" style="max-width:900px"><form class="form-grid" id="addTaskForm"><div class="field full"><label>Task title</label><input name="title" required placeholder="e.g. Build analytics page"></div><div class="field full"><label>Description</label><textarea name="description" rows="4" required placeholder="Describe the task and expected outcome"></textarea></div><div class="field"><label>Assign to</label><select name="assignee" data-member-select></select></div><div class="field"><label>Priority</label><select name="priority"><option>Medium</option><option>High</option><option>Low</option></select></div><div class="field"><label>Status</label><select name="status"><option value="assigned">Assigned</option><option value="ongoing">Ongoing</option><option value="done">Done</option></select></div><div class="field"><label>Progress %</label><input type="number" min="0" max="100" value="0" name="progress"></div><div class="field"><label>Due date</label><input type="date" name="due" required></div><div class="field"><label>Initial update</label><input name="comment" placeholder="Optional comment"></div><div class="field full"><button class="btn" type="submit">Create & Assign Task</button></div></form></section></main></div></div><script src="admin.js"></script></body></html>
