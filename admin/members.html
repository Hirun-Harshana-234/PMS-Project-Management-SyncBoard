<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Members | SyncBoard</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="app-shell"><aside class="sidebar"><div class="brand"><div class="logo-mark">S</div>SyncBoard</div><nav class="nav"><a href="dashboard.html"><span>▦</span>Dashboard</a><a href="tasks.html"><span>☑</span>Manage Tasks</a><a href="add-task.html"><span>＋</span>Assign Task</a><a href="members.html" class="active"><span>👥</span>Members</a><a href="requests.html"><span>✦</span>Requests</a><a href="reports.html"><span>▤</span>Reports</a><a href="settings.html"><span>⚙</span>Settings</a></nav><div class="sidebar-bottom"><button class="btn secondary" data-admin-logout style="width:100%">↪ Logout</button></div></aside><div class="app-area"><header class="topbar"><div class="top-left"><button class="icon-btn mobile-menu" data-menu>☰</button><strong>Members</strong></div><div class="userbox"><button class="icon-btn" data-theme>◐</button><div class="avatar">AD</div><div class="usertext"><strong>Admin</strong><div class="small muted">Administrator</div></div></div></header><main class="main"><div class="page-head"><div><h1>Members</h1><p>Manage project members and review their current workload.</p></div></div><section class="panel" style="margin-bottom:18px"><h3>Add Member</h3><form id="addMemberForm" class="form-grid"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Role</label><input name="role" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Department</label><input name="department" required></div><div class="field full"><button class="btn" type="submit">Add Member</button></div></form></section><div class="member-grid" id="adminMemberGrid"></div>
