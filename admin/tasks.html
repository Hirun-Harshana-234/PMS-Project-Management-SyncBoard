<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Tasks | SyncBoard</title><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="app-shell"><aside class="sidebar"><div class="brand"><div class="logo-mark">S</div>SyncBoard</div><nav class="nav"><a href="dashboard.html"><span>▦</span>Dashboard</a><a href="tasks.html" class="active"><span>☑</span>Manage Tasks</a><a href="add-task.html"><span>＋</span>Assign Task</a><a href="members.html"><span>👥</span>Members</a><a href="requests.html"><span>✦</span>Requests</a><a href="reports.html"><span>▤</span>Reports</a><a href="settings.html"><span>⚙</span>Settings</a></nav><div class="sidebar-bottom"><button class="btn secondary" data-admin-logout style="width:100%">↪ Logout</button></div></aside><div class="app-area"><header class="topbar"><div class="top-left"><button class="icon-btn mobile-menu" data-menu>☰</button><strong>Manage Tasks</strong></div><div class="userbox"><button class="icon-btn" data-theme>◐</button><div class="avatar">AD</div><div class="usertext"><strong>Admin</strong><div class="small muted">Administrator</div></div></div></header><main class="main">
<div class="page-head"><div><h1>Tasks</h1><p>Update, reassign or delete tasks and review current progress.</p></div><div class="toolbar"><a class="btn" href="add-task.html">+ Assign Task</a></div></div><div class="stats"><div class="panel stat"><small>Total</small><h3 data-stat="total">0</h3></div><div class="panel stat"><small>Assigned</small><h3 data-stat="assigned">0</h3></div><div class="panel stat"><small>Ongoing</small><h3 data-stat="ongoing">0</h3></div><div class="panel stat"><small>Done</small><h3 data-stat="done">0</h3></div></div><div class="task-controls"><div class="search"><input id="taskSearch" placeholder="Search tasks or members..."></div><select id="taskMemberFilter" data-member-select class="btn secondary"></select></div><div class="board" id="adminTaskBoard"></div>
<div class="modal" id="taskModal"><div class="modal-card"><div class="modal-head"><h3 id="modalTaskTitle">Task</h3><button class="icon-btn" onclick="closeTask()">×</button></div><input id="modalTaskId" type="hidden"><div class="form-grid" style="margin-top:18px"><div class="field full"><label>Task title</label><input id="modalTitle"></div><div class="field full"><label>Description</label><textarea id="modalDescription" rows="3"></textarea></div><div class="field"><label>Status</label><select id="modalStatus"><option value="assigned">Assigned</option><option value="ongoing">Ongoing</option><option value="done">Done</option></select></div><div class="field"><label>Progress %</label><input id="modalProgress" type="number" min="0" max="100"></div><div class="field"><label>Assignee</label><select id="modalAssignee" data-member-select></select></div><div class="field"><label>Priority</label><select id="modalPriority"><option>Low</option><option>Medium</option><option>High</option></select></div><div class="field full"><label>Due date</label><input id="modalDue" type="date"></div></div><h4>Comments / updates</h4><div class="comment-list" id="commentList"></div><div class="field"><textarea id="newComment" rows="3" placeholder="Add admin update..."></textarea></div><button class="btn" onclick="saveAdminTask()">Save Changes</button></div></div>
</main></div></div><script src="admin.js"></script></body></html>
