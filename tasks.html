<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5fbfd"><meta name="description" content="SyncBoard project task management system">
<title>View Tasks | SyncBoard</title><link rel="stylesheet" href="css/style.css"></head><body>
<div class="app-shell"><aside class="sidebar"><div class="brand"><div class="logo-mark">S</div>SyncBoard</div><nav class="nav"><a href="home.html" class=""><span>⌂</span>Home</a><a href="tasks.html" class="active"><span>☑</span>View Tasks</a><a href="members.html" class=""><span>👥</span>Members</a><a href="request-admin.html"><span>✦</span>Request Admin</a></nav>
<div class="sidebar-bottom"><button class="btn secondary" data-logout style="width:100%">↪ Logout</button></div></aside><div class="app-area">
<header class="topbar">
 <div class="top-left"><button class="icon-btn mobile-menu" data-menu>☰</button><strong>View Tasks</strong></div>
 <div class="userbox"><button class="icon-btn" data-theme title="Toggle dark mode">◐</button><div class="avatar" data-avatar>A</div>
 <div class="usertext"><strong data-user-name>Hirun</strong><div class="small muted" data-user-role>Project Manager</div></div></div>
</header><main class="main">
<div class="page-head"><div><h1>Tasks</h1><p>Track assigned, ongoing and completed tasks, with comments and progress updates.</p></div></div>
<div class="stats"><div class="panel stat"><small>Total</small><h3 data-stat="total">0</h3></div><div class="panel stat"><small>Assigned</small><h3 data-stat="assigned">0</h3></div><div class="panel stat"><small>Ongoing</small><h3 data-stat="ongoing">0</h3></div><div class="panel stat"><small>Done</small><h3 data-stat="done">0</h3></div></div>
<div class="task-controls"><div class="search"><input id="taskSearch" placeholder="Search tasks or members..."></div><select id="taskMemberFilter" class="btn secondary"><option value="all">All Members</option><option>Sarah Johnson</option><option>Mike Ross</option><option>Alex Smith</option><option>Emily Davis</option><option>David Lee</option></select></div>
<div class="board" id="taskBoard"></div>
<div class="modal" id="taskModal"><div class="modal-card"><div class="modal-head"><h3 id="modalTaskTitle">Task</h3><button class="icon-btn" onclick="closeTask()">×</button></div><input id="modalTaskId" type="hidden">
<div class="form-grid" style="margin-top:18px"><div class="field"><label>Status</label><select id="modalStatus"><option value="assigned">Assigned</option><option value="ongoing">Ongoing</option><option value="done">Done</option></select></div>
<div class="field"><label>Progress %</label><input id="modalProgress" type="number" min="0" max="100"></div><div class="field full"><label>Assignee</label><select id="modalAssignee">
    <option>Hirun Harshana</option>
    <option>Methul Demika</option>
    <option>Disen Devmika</option>
    <option>Nethushi Aloka</option>
    <option>Hasini Gunathilake</option>
    <option>Kaveesha Navodi</option>
</select></div></div>
<h4>Comments / updates</h4><div class="comment-list" id="commentList"></div><div class="field"><textarea id="newComment" rows="3" placeholder="Add a progress comment..."></textarea></div><button class="btn" id="saveTaskButton" onclick="saveTaskUpdate()">Save Update</button></div></div></main></div></div>
<script src="js/app.js"></script></body></html>
